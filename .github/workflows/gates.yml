name: gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependencies
        run: python3 -m pip install jsonschema
      - name: Registry validators
        run: |
          python3 tools/validate_engine_registry.py
          python3 tools/validate_phase2_registry.py
          python3 tools/validate_phase3_registry.py
      - name: Python test suite
        run: python3 -m unittest discover -s tools/tests
      - name: Frozen theme hashes
        run: |
          printf '83cf832b9d037daf2be0d0e57d70f96e4df3b286a0a6041f40ee13ee37ec956d  theme/theme.qml\n555b32df5f07153d34e0e40addd3d70068768cb684aaccf1793e5f7a75f4350b  theme/theme.cfg\n' | shasum -a 256 -c -

  java-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Host Java tests
        run: ./unified-android/test.sh

  native-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native host tests with sanitizers
        run: ./unified-android/native/run_tests.sh
